<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Day Hotel</title>
<link rel="icon" href="./assets/worldhotels-window-BoEwWbQL.svg" type="image/svg+xml">
<style>
  :root { --bg: #f3e9dc; --ink: #111111; --card: #ffffff; --accent: #fd4d3d; --accent-dark: #d63a2b; --ok: #2f7d55; } /* WorldHotels: coral (#FD4D3D, accent1 in the WorldHotels PPT template), white, black */
  html, body { margin: 0; height: 100%; background: var(--bg); font: 18px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* top bar: menu, the room or hotel name, points */
  .hud { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3; }
  .hud > * { pointer-events: auto; }
  .btn { min-height: 52px; min-width: 52px; border: 0; border-radius: 999px; background: var(--card); font-weight: 800; font-size: 19px; padding: 0 18px; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
  #menu { padding: 0; font-size: 24px; flex: none; }
  .hud h1#title.squeeze { overflow-wrap: anywhere; }
  #menu.back { padding: 0 14px; font-size: 17px; white-space: nowrap; background: var(--ink); color: #fff; }
  .pill { display: flex; align-items: baseline; gap: 6px; min-height: 52px; box-sizing: border-box; padding: 9px 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; box-shadow: 0 4px 14px rgba(253,77,61,.4); white-space: nowrap; flex: none; }
  .pill b { font-size: 28px; line-height: 1; }
  .pill.tight { padding: 9px 12px; gap: 4px; font-size: 14px; } .pill.tight b { font-size: 24px; } /* main.js fitTitle: room for a long title */
  .pill.bump { animation: bump .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .status { position: fixed; top: calc(68px + env(safe-area-inset-top)); right: 16px; font-size: 13px; font-weight: 700; opacity: .6; z-index: 3; }
  /* the room or hotel name, centered between the menu and the points (two lines at most) */
  .hud h1#title { flex: 0 1 auto; min-width: 0; margin: 0 auto; box-sizing: border-box; font-size: 19px; line-height: 1.15; text-align: center; background: rgba(255,255,255,.92); padding: 7px 14px; border-radius: 22px; box-shadow: 0 1px 4px rgba(0,0,0,.12); overflow-wrap: normal; pointer-events: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* bottom: room buttons (whole hotel) and the coach line */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 97%, transparent) 16px); display: flex; flex-direction: column; gap: 8px; }
  /* compact chips that wrap: two rows on a phone instead of three, so the hotel gets the space */
  .rooms { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .rooms button { min-height: 48px; border: 0; border-radius: 999px; background: var(--card); font-weight: 700; font-size: 17px; padding: 6px 16px 6px 12px; display: flex; gap: 6px; align-items: center; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .rooms button.done { background: var(--ink); color: #fff; }
  /* the whole hotel: smaller chips, "Enter code" as the last one, so the hotel gets the screen */
  .sheet.compact { gap: 6px; padding-top: 6px; }
  .sheet.compact .rooms { gap: 5px; }
  .sheet.compact .rooms button { min-height: 42px; font-size: 15px; padding: 4px 12px 4px 9px; gap: 4px; }
  .rooms button.codechip { background: var(--accent); color: #fff; }
  .rooms button.codechip i { font-style: normal; }
  .sheet.compact .hint { font-size: 15px; }
  .sheet.compact .rooms { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; margin: 0 -10px; padding: 2px 10px 4px; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .sheet.compact .rooms::-webkit-scrollbar { display: none; }
  .sheet.compact .rooms button { flex: none; min-height: 40px; }
  .note { margin: 4px 2px 10px; font-size: 14px; line-height: 1.35; opacity: .7; }
  button.share { min-height: 52px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  button.namebtn { display: block; width: 100%; margin-top: 6px; min-height: 48px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); font: inherit; font-weight: 700; font-size: 18px; text-align: left; padding: 8px 14px; }
  /* the things you can change in this room: a row that scrolls sideways; a coral dot = still on the free item */
  .things { display: flex; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; margin: 0 -10px; padding: 4px 10px 2px; touch-action: pan-x; }
  .things::-webkit-scrollbar { display: none; }
  .things button { position: relative; flex: none; width: 74px; border: 0; border-radius: 14px; background: var(--card); padding: 4px 3px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .things img { width: 48px; height: 48px; }
  .things span { width: 100%; font-size: 12px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .things button.free::after { content: ''; position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--card); }
  .modal .things { flex-wrap: wrap; justify-content: center; overflow: visible; margin: 0; padding: 4px 0 8px; }
  .modal .things button { width: 92px; }
  .modal .things img { width: 64px; height: 64px; }
  .modal .things span { font-size: 14px; white-space: normal; }
  /* fully renovated: submitting is the big next step */
  button.coach.primary { background: var(--accent); color: #fff; border-left-color: var(--ink); }
  button.coach.primary i { color: #fff; }
  /* the hotel's name at the top: tap it to rename */
  .hud h1#title.tap { pointer-events: auto; cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > :first-child { flex: 1; min-width: 0; }
  .hint { margin: 0 4px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.3; opacity: .8; }
  .coach { display: flex; align-items: center; gap: 10px; min-height: 54px; box-sizing: border-box; width: 100%; border: 0; border-radius: 18px; background: var(--card); padding: 9px 16px; font-weight: 700; font-size: 18px; line-height: 1.25; text-align: left; box-shadow: 0 2px 10px rgba(0,0,0,.16); }
  .coach span { flex: 1; }
  .coach i { font-style: normal; font-size: 34px; line-height: 1; color: var(--accent); }
  button.coach { border-left: 8px solid var(--accent); }
  .locked { background: var(--card); border-radius: 18px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.16); }
  .locked b { font-size: 21px; }
  .locked p { margin: 6px 0 12px; font-size: 18px; }
  .scorerow { display: flex; gap: 8px; }
  .scorerow input { width: 96px; flex: none; font-size: 26px; font-weight: 800; text-align: center; border: 2px solid var(--ink); border-radius: 14px; }
  .scorerow button { flex: 1; }
  /* "Enter code", always next to the coach line */
  .codebtn { flex: none; width: 86px; min-height: 54px; border: 0; border-radius: 18px; background: var(--ink); color: #fff; font-weight: 800; font-size: 14px; line-height: 1.1; padding: 6px 4px; box-shadow: 0 2px 10px rgba(0,0,0,.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .codebtn i { font-style: normal; font-size: 22px; line-height: 1; }
  .big { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 18px; }

  /* modals */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 60%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 5; -webkit-user-select: text; user-select: text; }
  .modal[hidden] { display: none; }
  .modal .card { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; box-sizing: border-box; background: var(--card); border-radius: 24px; padding: 24px 20px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.18); text-align: center; }
  .modal h2 { margin: 4px 0 10px; font-size: 26px; line-height: 1.2; }
  .modal p { margin: 0 0 14px; opacity: .85; }
  .modal .first { font-weight: 700; opacity: 1; font-size: 20px; }
  .modal .cardimg { display: block; width: auto; max-width: 100%; max-height: 50dvh; margin: 0 auto 12px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); -webkit-touch-callout: default; }
  .modal .warn { color: #b3361f; opacity: 1; font-weight: 600; }
  .modal .primary { display: block; width: 100%; min-height: 56px; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--accent); color: #fff; font: 800 20px system-ui, sans-serif; box-shadow: 0 4px 14px rgba(253,77,61,.35); margin-top: 8px; }
  .modal .primary:disabled { opacity: .5; }
  .modal .link { display: block; width: 100%; min-height: 48px; border: 0; background: none; padding: 12px; font-weight: 600; text-decoration: underline; }
  .modal .row { display: block; width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid #eee; background: none; padding: 14px 4px; font-weight: 700; font-size: 19px; text-align: left; }
  .modal .langs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .modal .lang { min-height: 48px; border: 2px solid #ddd; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 17px; }
  .modal .lang.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .modal input, .modal textarea { box-sizing: border-box; width: 100%; min-height: 52px; border: 2px solid #ddd; border-radius: 14px; padding: 11px 14px; font: 18px system-ui, sans-serif; margin: 6px 0; color: var(--ink); background: #fff; }
  .modal input.big { font-size: 26px; text-align: center; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
  .modal input.big-name { font-size: 24px; text-align: center; font-weight: 700; }
  .modal .field { display: block; text-align: left; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .modal .code { display: flex; flex-direction: column; gap: 4px; font-size: 15px; opacity: 1; }
  .modal .code b { font-size: 32px; letter-spacing: .12em; }

  /* the in-game camera for room signs */
  .modal .scanbtn { display: block; width: 100%; min-height: 56px; border: 0; border-radius: 999px; padding: 12px 20px; background: var(--ink); color: #fff; font: 800 19px system-ui, sans-serif; margin-top: 10px; }
  .scan { position: relative; width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #111; margin: 4px 0 6px; }
  .scan video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan .aim { position: absolute; inset: 18%; border: 4px solid #fff; border-radius: 16px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); pointer-events: none; }
  /* the change panel: a tall sheet of big cards */
  .modal.shop { padding: 0; place-items: end center; }
  .modal.shop .card { width: min(560px, 100%); max-height: 92dvh; border-radius: 26px 26px 0 0; padding: 0 14px calc(18px + env(safe-area-inset-bottom)); text-align: left; }
  .panel-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; background: var(--card); padding: 18px 2px 8px; }
  .panel-head h2 { flex: 1; margin: 0; }
  .x { width: 52px; height: 52px; flex: none; border: 0; border-radius: 50%; background: #f1ece5; font-size: 24px; font-weight: 800; }
  .modal .have { margin: 0 2px 12px; font-weight: 700; font-size: 18px; opacity: 1; color: var(--accent-dark); }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .item { display: grid; grid-template-columns: 116px 1fr; gap: 6px 14px; align-items: center; padding: 12px; border-radius: 20px; background: #faf6f0; border: 3px solid transparent; }
  .item.chosen { border-color: var(--ok); background: #eef7f1; }
  .item .pic { width: 116px; height: 116px; border-radius: 14px; background: #fff6e6; object-fit: contain; grid-row: span 1; }
  .item .txt { display: flex; flex-direction: column; gap: 4px; }
  .item .txt b { font-size: 20px; line-height: 1.2; }
  .item .txt span { font-size: 16px; line-height: 1.35; opacity: .8; }
  .item .buy { grid-column: 1 / -1; min-height: 56px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: 20px; box-shadow: 0 3px 10px rgba(253,77,61,.3); }
  .item .buy.free { background: var(--ink); box-shadow: none; }
  .item .buy:disabled { background: #d9d2c8; color: #6b625a; box-shadow: none; }
  .item.chosen .buy:disabled { background: var(--ok); color: #fff; }
  /* slots without descriptions (all but the PMS): two cards a row, picture on top */
  .cards.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cards.grid .item { grid-template-columns: 1fr; gap: 6px; padding: 8px; align-content: start; text-align: center; }
  .cards.grid .item .pic { width: 100%; height: auto; aspect-ratio: 1; }
  .cards.grid .item .txt b { font-size: 17px; }
  .cards.grid .item .buy { min-height: 48px; font-size: 16px; padding: 0 6px; }
  .cards.grid .item small { font-size: 14px; }
  .item small { grid-column: 1 / -1; text-align: center; font-size: 16px; font-weight: 600; opacity: .75; }

  .bubble { position: fixed; z-index: 4; transform: translate(-50%, -100%); max-width: 70vw; background: var(--card); color: var(--ink); font: 700 17px/1.3 system-ui, sans-serif; padding: 10px 14px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none; text-align: center; animation: float 1.9s ease-out forwards; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--card); }
  @keyframes float { 0% { opacity: 0; transform: translate(-50%, -80%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -110%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }
  .toast { position: fixed; z-index: 6; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); animation: toast 2.6s ease forwards; width: max-content; max-width: 88vw; text-align: center; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .celebrate { position: fixed; z-index: 6; left: 50%; top: 32%; transform: translate(-50%, -50%); background: var(--accent); color: #fff; padding: 20px 28px; border-radius: 24px; text-align: center; box-shadow: 0 10px 40px rgba(253,77,61,.45); animation: pop 2.6s cubic-bezier(.2,1.4,.4,1) forwards; pointer-events: none; width: max-content; max-width: 86vw; }
  .celebrate b { display: block; font-size: 28px; }
  .celebrate span { display: block; font-size: 20px; font-weight: 700; opacity: .9; margin-top: 2px; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.95); } }
  @media (prefers-reduced-motion: reduce) { .celebrate, .toast, .bubble { animation-duration: .01s; animation-iteration-count: 1; } .celebrate { animation: none; } .pill.bump { animation: none; } }
</style>
  
</head>
<body>
<div id="app"></div>
<div class="hud">
  <button class="btn" id="menu" aria-label="Menu">☰</button>
  <h1 id="title"></h1>
  <span class="pill" id="points"></span>
</div>
<span class="status" id="status"></span>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal" hidden><div class="card" id="modalBody"></div></div>
<script type="module">
// Gate for the locked build (scripts/build_locked.mjs), inlined into index.html.
// site.bin = salt (16 bytes) + IV (12) + AES-GCM ciphertext of the game's JS bundle.
// The key is PBKDF2-SHA-256 of the event token, which comes from the QR link
// (#k=…) or, when the game is reopened without the link, from the game's saved
// state on this phone. Without the token the bundle can't be read, so the
// webhook key and the claim-code hashes inside it stay private.
const ITER = 100000, BIN = "site-d31b12ab.bin", MSG = {"en":{"title":"Scan the QR code at Tech Day to play","body":"The game opens from the QR code on the screen at the start of Tech Day."},"sv":{"title":"Skanna QR-koden på Tech Day för att spela","body":"Spelet öppnas från QR-koden på skärmen i början av Tech Day."},"no":{"title":"Skann QR-koden på Tech Day for å spille","body":"Spillet åpnes fra QR-koden på skjermen i starten av Tech Day."},"da":{"title":"Scan QR-koden på Tech Day for at spille","body":"Spillet åbnes fra QR-koden på skærmen i starten af Tech Day."}};

function savedState() {
  try { return JSON.parse(localStorage.getItem('techday-hotel-v1') || '{}'); } catch { return {}; }
}
const token = () => new URLSearchParams(location.hash.slice(1)).get('k') || savedState().token || null;

function gate(kind) {
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  const lang = savedState().lang || ({ nb: 'no', nn: 'no' }[nav] || nav);
  const m = MSG[lang] || MSG.en;
  const body = document.getElementById('modalBody');
  body.innerHTML = kind === 'offline'
    ? '<h2>No connection</h2><p>The game didn\'t load. Check your connection and reload.</p>'
    : `<h2>${m.title}</h2><p>${m.body}</p>`;
  document.getElementById('modal').hidden = false;
  // a QR scan in the same tab only changes the hash: try again with the new token
  addEventListener('hashchange', () => location.reload(), { once: true });
}

(async () => {
  const k = token();
  if (!k) return gate('token');
  try {
    const buf = await (await fetch(BIN)).arrayBuffer();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(k), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: new Uint8Array(buf, 0, 16), iterations: ITER }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const js = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 16, 12) }, key, new Uint8Array(buf, 28));
    await import(URL.createObjectURL(new Blob([js], { type: 'text/javascript' })));
  } catch (err) {
    gate(err?.name === 'OperationError' ? 'token' : 'offline');
  }
})();
</script>
</body>
</html>
